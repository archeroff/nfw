name: Build & Release APK

on:
  push:
    branches: [main]

jobs:
  build-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Determine next version
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | head -n1)
          if [ -z "$LATEST" ]; then
            NEXT="1.0.0"
          else
            PATCH=${LATEST##*.}
            MINOR=${LATEST%.*}
            NEXT="${MINOR}.$((PATCH + 1))"
          fi
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Set version in build.gradle.kts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          VERSION_CODE=$(echo "$VERSION" | tr '.' '+')
          sed -i "s/versionCode = [0-9]*/versionCode = ${VERSION_CODE}/" androidApp/build.gradle.kts
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"${VERSION}\"/" androidApp/build.gradle.kts

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew :androidApp:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p release
          cp androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk \
             release/wfh-${{ steps.version.outputs.version }}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release/wfh-${{ steps.version.outputs.version }}.apk
