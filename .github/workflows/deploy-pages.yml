name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wasm distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon

      - name: Assemble deployable site
        run: ./scripts/assemble-web.sh

      - name: Smoke test deployable site
        run: |
          for f in index.html manifest.webmanifest sw.js styles.css webApp.js \
                   icons/icon-192.png icons/icon-512.png icons/icon-512-maskable.png; do
            test -f "build/web/$f" || { echo "Missing: $f"; exit 1; }
          done
          ls build/web/*.wasm >/dev/null || { echo "Missing wasm bundle"; exit 1; }
          grep -q "serviceWorker" build/web/index.html || { echo "SW not registered"; exit 1; }
          grep -q "w-cache-v" build/web/sw.js || { echo "SW cache version missing"; exit 1; }
          echo "Smoke test passed"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
