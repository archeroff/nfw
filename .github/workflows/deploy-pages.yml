name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build wasm distribution
        run: ./gradlew :webApp:wasmJsBrowserDistribution --no-daemon

      - name: Assemble deployable site
        run: ./scripts/assemble-web.sh

      - name: Smoke test deployable site
        run: |
          for f in index.html manifest.webmanifest sw.js styles.css webApp.js \
                   icons/icon-192.png icons/icon-512.png icons/icon-512-maskable.png; do
            test -f "build/web/$f" || { echo "Missing: $f"; exit 1; }
          done
          ls build/web/*.wasm >/dev/null || { echo "Missing wasm bundle"; exit 1; }
          grep -q "serviceWorker" build/web/index.html || { echo "SW not registered"; exit 1; }
          grep -q "w-cache-v" build/web/sw.js || { echo "SW cache version missing"; exit 1; }
          echo "Smoke test passed"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ensure GitHub Pages is enabled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PAGES_URL="https://api.github.com/repos/${GITHUB_REPOSITORY}/pages"
          AUTH=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json")
          get() { curl -s -w "\n%{http_code}" "${AUTH[@]}" "$PAGES_URL"; }
          GET=$(get)
          BODY="${GET%$'\n'*}"
          CODE="${GET##*$'\n'}"
          if [ "$CODE" = "200" ] && echo "$BODY" | grep -q '"build_type": "workflow"'; then
            echo "GitHub Pages is already enabled (build_type=workflow)"
            exit 0
          fi
          echo "GitHub Pages not ready (http ${CODE}) - attempting to enable via API..."
          curl -s -X PUT "${AUTH[@]}" -d '{"build_type":"workflow"}' "$PAGES_URL"
          echo ""
          sleep 2
          GET2=$(get)
          CODE2="${GET2##*$'\n'}"
          if [ "$CODE2" = "200" ]; then
            echo "GitHub Pages enabled via API (build_type=workflow)"
            exit 0
          fi
          echo "::error::Could not enable GitHub Pages automatically. Enable it manually at https://github.com/${GITHUB_REPOSITORY}/settings/pages (Build and deployment -> Source -> GitHub Actions), then re-run this workflow."
          exit 1

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
